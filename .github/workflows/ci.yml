name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install pillow numpy pytest opencv-python-headless
      - run: python -m pytest -q tests
      - name: no personal paths or secrets
        run: |
          ! grep -rnE "/Users/|Mobile Documents|CloudStorage" --exclude-dir=.git --exclude-dir=.github .
